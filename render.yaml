services:
  - type: web
    name: campus-vendors-mobile-api
    runtime: node
    branch: app-dev
    plan: free
    buildCommand: npm ci --prefix server --omit=optional
    startCommand: node server/index.js
    healthCheckPath: /api/mobile/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: campus_vendors_mobile
      - key: MOBILE_ONLY
        value: "1"
      - key: MOBILE_AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
